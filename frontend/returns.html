<!doctype html>
<html lang="en-US" ng-app="returnsApp">
  <head>
    <title>Retrowares | Returns</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  </head>

  <body ng-controller="returnsCtrl">
    <div class="container mt-5">
      <div class="text-center mb-2">
        <img src="Retrowares.png" width="400" alt="Retrowares Logo" />
      </div>
      <nav
        class="navbar navbar-expand-lg bg-white shadow-sm rounded-pill border px-4 py-2"
      >
        <div class="container">
          <a class="navbar-brand" href="#"></a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavDropdown"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse justify-content-center"
            id="navbarNavDropdown"
          >
            <ul class="navbar-nav mx-auto gap-5">
              <li class="nav-item active">
                <a class="nav-link" href="../usermanagement/usermanagement.html"
                  >User Management</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../product/product.html">Products</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../shoppingcart/shoppingcart.html"
                  >Shopping Cart</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../shipping/shipping.html"
                  >Shipping</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../billings/billings.html"
                  >Billings</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../returns/returns.html">Returns</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <div class="container-fluid py-5">
        <div class="d-flex justify-content-center gap-4">
          <form
            id="returnsForm"
            class="bg-white p-4 rounded shadow-sm"
            style="width: 500px"
          >
            <div class="mb-3">
              <h3 class="text-center"><b>Product Return Form</b></h3>
              <p class="text-center mb-4">
                <i>Please ensure all details are accurate.</i>
              </p>
              <label for="fullName" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="fullName" required />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="e.g. johndoe@gmail.com"
                required
              />
            </div>
            <div class="mb-3">
              <label for="returnProduct" class="form-label"
                >Product to Return</label
              >
              <input
                type="text"
                class="form-control"
                id="returnProduct"
                required
              />
            </div>
            <div class="mb-3">
              <label for="returnReason" class="form-label"
                >Reason for Return</label
              >
              <select class="form-select" id="returnReason" required>
                <option value="" disabled selected hidden>Select</option>
                <option value="defective">Defective</option>
                <option value="wrongitem">Wrong Item</option>
                <option value="unwanted">Unwanted</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="d-flex justify-content-center">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-send"></i> Submit
              </button>
            </div>
          </form>
        </div>
      </div>
      <div id="successModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Success!</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <p>Your return has been submitted for processing.</p>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-primary mt-3"
                data-bs-dismiss="modal"
              >
                Thanks!
              </button>
            </div>
          </div>
        </div>
      </div>
      <footer class="text-center mt-5">
        <p>© 2026 Copyright: Retrowares</p>
      </footer>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="returns.js"></script>
  </body>
</html>
