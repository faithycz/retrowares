<!doctype html>
<html lang="en-US" ng-app="shippingApp">
  <head>
    <title>Retrowares | Shipping</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  </head>

  <body ng-controller="shippingCtrl">
    <div class="container mt-5">
      <div class="text-center mb-2">
        <img src="Retrowares.png" width="400" alt="Retrowares Logo" />
      </div>
      <nav
        class="navbar navbar-expand-lg bg-white shadow-sm rounded-pill border px-4 py-2"
      >
        <div class="container">
          <a class="navbar-brand" href="#"></a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavDropdown"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse justify-content-center"
            id="navbarNavDropdown"
          >
            <ul class="navbar-nav mx-auto gap-5">
              <li class="nav-item active">
                <a class="nav-link" href="../usermanagement/usermanagement.html"
                  >User Management</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../product/product.html">Products</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../shoppingcart/shoppingcart.html"
                  >Shopping Cart</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../shipping/shipping.html"
                  >Shipping</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../billings/billings.html"
                  >Billings</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../returns/returns.html">Returns</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <div class="container-fluid py-5">
        <div class="d-flex justify-content-center gap-4">
          <form
            id="shippingForm"
            class="bg-white p-4 rounded shadow-sm"
            style="width: 500px"
          >
            <div class="mb-3">
              <h3 class="text-center">
                <i class="bi bi-truck"></i> <b>Shipping Details</b>
              </h3>
              <p class="text-center mb-4">
                <i>Please ensure all details are accurate.</i>
              </p>
              <label for="firstName" class="form-label">First Name</label>
              <input type="text" class="form-control" id="firstName" required />
            </div>
            <div class="mb-3">
              <label for="lastName" class="form-label">Last Name</label>
              <input type="text" class="form-control" id="lastName" required />
            </div>
            <div class="mb-3">
              <label for="address1" class="form-label">Address Line 1</label>
              <input
                type="text"
                class="form-control"
                id="address1"
                placeholder="e.g. 100 Random Rd"
                required
              />
            </div>
            <div class="mb-3">
              <label for="address2" class="form-label"
                >Address Line 2 (optional)</label
              >
              <input type="text" class="form-control" id="address2" />
            </div>
            <div class="mb-3">
              <label for="city" class="form-label">City</label>
              <input type="text" class="form-control" id="city" required />
            </div>
            <div class="mb-3">
              <label for="state" class="form-label">State</label>
              <select class="form-select" id="state" required>
                <option value="" disabled selected hidden>Select</option>
                <option value="AL">AL</option>
                <option value="AK">AK</option>
                <option value="AZ">AZ</option>
                <option value="AR">AR</option>
                <option value="CA">CA</option>
                <option value="CO">CO</option>
                <option value="CT">CT</option>
                <option value="DE">DE</option>
                <option value="FL">FL</option>
                <option value="GA">GA</option>
                <option value="HI">HI</option>
                <option value="ID">ID</option>
                <option value="IL">IL</option>
                <option value="IN">IN</option>
                <option value="IA">IA</option>
                <option value="KS">KS</option>
                <option value="KY">KY</option>
                <option value="LA">LA</option>
                <option value="ME">ME</option>
                <option value="MD">MD</option>
                <option value="MA">MA</option>
                <option value="MI">MI</option>
                <option value="MN">MN</option>
                <option value="MS">MS</option>
                <option value="MO">MO</option>
                <option value="MT">MT</option>
                <option value="NE">NE</option>
                <option value="NV">NV</option>
                <option value="NH">NH</option>
                <option value="NJ">NJ</option>
                <option value="NM">NM</option>
                <option value="NY">NY</option>
                <option value="NC">NC</option>
                <option value="ND">ND</option>
                <option value="OH">OH</option>
                <option value="OK">OK</option>
                <option value="OR">OR</option>
                <option value="PA">PA</option>
                <option value="RI">RI</option>
                <option value="SC">SC</option>
                <option value="SD">SD</option>
                <option value="TN">TN</option>
                <option value="TX">TX</option>
                <option value="UT">UT</option>
                <option value="VT">VT</option>
                <option value="VA">VA</option>
                <option value="WA">WA</option>
                <option value="WV">WV</option>
                <option value="WI">WI</option>
                <option value="WY">WY</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="zipCode" class="form-label">ZIP Code</label>
              <input
                type="text"
                class="form-control"
                id="zipCode"
                placeholder="e.g. 12345"
                required
                pattern="[0-9]{5}(-[0-9]{4})?"
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Shipping Carrier</label>
              <select class="form-select" id="carrier" required>
                <option value="" selected disabled>Select</option>
                <option value="FedEx">FedEx</option>
                <option value="UPS">UPS</option>
                <option value="USPS">USPS</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Shipping Method</label>
              <select class="form-select" id="method" required>
                <option value="" disabled selected hidden>Select</option>
                <option value="Ground">Ground</option>
                <option value="2-Day">2-Day</option>
                <option value="Overnight">Overnight</option>
              </select>
            </div>
            <div class="d-flex justify-content-end">
              <button type="submit" class="btn btn-primary">
                Continue <i class="bi bi-arrow-right"></i>
              </button>
            </div>
          </form>
        </div>
      </div>
      <div id="successModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Success!</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <p>You can continue on to billing.</p>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-primary mt-3"
                data-bs-dismiss="modal"
              >
                Thanks!
              </button>
            </div>
          </div>
        </div>
      </div>
      <footer class="text-center mt-5">
        <p>© 2026 Copyright: Retrowares</p>
      </footer>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="shipping.js"></script>
  </body>
</html>
