<!doctype html>
<html lang="en-US">
  <head>
    <title>Retrowares | Products</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-5">
      <div class="text-center mb-2">
        <img src="Retrowares.png" width="400" alt="Retrowares Logo" />
      </div>
      <nav
        class="navbar navbar-expand-lg bg-white shadow-sm rounded-pill border px-4 py-2"
      >
        <div class="container">
          <a class="navbar-brand" href="#"></a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavDropdown"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse justify-content-center"
            id="navbarNavDropdown"
          >
            <ul class="navbar-nav mx-auto gap-5">
              <li class="nav-item active">
                <a class="nav-link" href="../usermanagement/usermanagement.html"
                  >User Management</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../product/product.html">Products</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../shoppingcart/shoppingcart.html"
                  >Shopping Cart</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../shipping/shipping.html"
                  >Shipping</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../billings/billings.html"
                  >Billings</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../returns/returns.html">Returns</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <div class="row gx-5">
        <div class="col-md-6">
          <section id="product-list" class="mt-5">
            <h2 class="mb-3"><b>Popular Items</b></h2>
          </section>
        </div>

        <div class="col-lg-6 mt-5">
          <form id="productForm" class="p-4 shadow rounded bg-white">
            <h2 class="text-start"><b>Add a New Product</b></h2>
            <p class="text-start mb-5">
              <i>Must be 2000s-era or earlier electronics.</i>
            </p>
            <div class="mb-3">
              <label for="productName" class="form-label">Product Name</label>
              <input
                type="text"
                id="productName"
                class="form-control"
                placeholder="e.g. Game Boy Advance"
                required
              />
            </div>
            <div class="mb-3">
              <label for="productDesc" class="form-label"
                >Product Description</label
              >
              <input
                type="text"
                id="productDesc"
                class="form-control"
                placeholder="e.g. A 2001 32-bit handheld game console by Nintendo."
                required
              />
            </div>
            <div class="mb-3">
              <label for="productType" class="form-label">Product Type</label>
              <select
                id="productType"
                select
                class="form-select"
                class="form-control"
                required
              >
                <option value="" disabled selected hidden>Select</option>
                <option value="phones">Phones</option>
                <option value="computers">Computers</option>
                <option value="gaming">Gaming</option>
                <option value="audio">Audio</option>
                <option value="accessories">Accessories</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="productPrice" class="form-label">Price (USD)</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input
                  type="number"
                  id="productPrice"
                  class="form-control"
                  step="0.01"
                  placeholder="0.00"
                  required
                />
              </div>
            </div>
            <div class="mb-3">
              <button
                type="submit"
                class="btn btn-outline-primary btn-lg mt-4 w-100"
                id="loginBtn"
              >
                <i class="bi bi-send"></i> Submit
              </button>
            </div>
          </form>

          <div class="mt-4" id="readBtn">
            <input
              id="readProductId"
              class="form-control"
              placeholder="Enter Product ID"
            />
            <button
              type="button"
              class="btn btn-secondary w-100 mt-4"
              onclick="readProducts()"
            >
              Find Available Products
            </button>
            <div id="getProducts" class="mt-3"></div>
          </div>
        </div>
      </div>
      <div id="successModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Success!</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <p>Your product has been added.</p>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-primary mt-3"
                data-bs-dismiss="modal"
              >
                Thanks!
              </button>
            </div>
          </div>
        </div>
      </div>
      <footer class="text-center mt-5">
        <p>© 2026 Copyright: Retrowares</p>
      </footer>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="product.js"></script>
  </body>
</html>
