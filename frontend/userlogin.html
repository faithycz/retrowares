<!doctype html>
<html lang="en-US">
  <head>
    <title>Retrowares | Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="text-center mb-4">
            <img src="Retrowares.png" width="400" alt="Retrowares Logo" />
          </div>

          <form id="loginForm" class="p-4 shadow rounded bg-white">
            <h2 class="text-center"><b>Log in to Retrowares</b></h2>
            <p class="text-center mb-5">Welcome back to the past!</p>
            <div class="mb-3">
              <label for="email" class="form-label"
                ><i class="bi bi-envelope"></i> Email</label
              >
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Enter your email..."
                required
              />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label"
                ><i class="bi bi-lock"></i> Password</label
              >
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Enter your password..."
                required
              />
            </div>
            <div>
              <input
                type="checkbox"
                id="signincheckbox"
                name="signincheckbox"
                value="signincheckbox"
              />
              <label for="signincheckbox">Stay signed in</label>
            </div>
            <div class="col-12 text-center">
              <button
                type="submit"
                class="btn btn-outline-primary btn-lg mt-4 w-100"
                id="loginBtn"
              >
                Log in
              </button>
            </div>
          </form>

          <div class="mt-4" id="readBtn">
            <button
              type="button"
              class="btn btn-secondary w-100 mt-4"
              onclick="readUsers()"
            >
              Read Users
            </button>
            <div id="getUsers" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="successModal" class="modal fade" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Success!</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <p>Login successful.</p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-primary mt-3"
              data-bs-dismiss="modal"
            >
              Thanks!
            </button>
          </div>
        </div>
      </div>
    </div>
    <footer class="text-center mt-5">
      <p>© 2026 Copyright: Retrowares</p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="userlogin.js"></script>
  </body>
</html>
